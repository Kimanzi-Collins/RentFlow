<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded dark background -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>

  <!-- Roof / triangle peak -->
  <path d="M4.5 13 L16 5.5 L27.5 13" stroke="white" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main building body -->
  <rect x="7" y="12.5" width="18" height="14" rx="1.2"
        fill="#0a0a0a" stroke="white" stroke-width="1.5"/>

  <!-- Left window -->
  <rect x="9.5" y="15.5" width="4" height="3.5" rx="0.6" fill="white"/>

  <!-- Right window -->
  <rect x="18.5" y="15.5" width="4" height="3.5" rx="0.6" fill="white"/>

  <!-- Door -->
  <rect x="13.5" y="20.5" width="5" height="6" rx="0.6" fill="white"/>
</svg>
