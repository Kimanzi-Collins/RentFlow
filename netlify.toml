# ─── Build Settings ───────────────────────────────────────────────────────────
[build]
  command       = "npm run build"
  publish       = "dist"
  ignore        = "backend"          # don't try to deploy the Express backend

[build.environment]
  NODE_VERSION  = "20"

# ─── SPA Routing (React Router) ───────────────────────────────────────────────
# All routes → index.html so React Router handles them client-side.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ─── Security Headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    # CSP: the app is built as a single inlined HTML file (vite-plugin-singlefile), so inline
    # scripts/styles must stay allowed; everything else (network, frames, plugins, base URL,
    # form targets) is locked to what the app actually uses: Supabase, Google Fonts, Unsplash.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# JS / CSS bundles — cache aggressively (Vite hashes the filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
